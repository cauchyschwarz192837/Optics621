<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#26749b"/></marker></defs><rect width="1200" height="660" fill="#f7fafc"/><g font-family="Arial" fill="#16394a"><text x="40" y="45" font-size="25" font-weight="bold">Intensity-coded FMCW LiDAR — revised model boundary</text><rect x="40" y="100" width="210" height="75" rx="8" fill="white" stroke="#26749b"/><text x="145.0" y="129" text-anchor="middle" font-size="17">Laser A + power split</text><text x="145.0" y="154" text-anchor="middle" font-size="13">Behavioral chirp / phase noise</text><rect x="360" y="100" width="210" height="75" rx="8" fill="white" stroke="#26749b"/><text x="465.0" y="129" text-anchor="middle" font-size="17">Coding MZM</text><text x="465.0" y="154" text-anchor="middle" font-size="13">Signed complex field m(V)</text><rect x="760" y="100" width="330" height="75" rx="8" fill="white" stroke="#26749b"/><text x="925.0" y="129" text-anchor="middle" font-size="17">Launch → target → collection</text><text x="925.0" y="154" text-anchor="middle" font-size="13">Delay, attenuation, coherent coupling</text><rect x="40" y="290" width="230" height="75" rx="8" fill="white" stroke="#26749b"/><text x="155.0" y="319" text-anchor="middle" font-size="17">Delay MZI + readout</text><text x="155.0" y="344" text-anchor="middle" font-size="13">Independent synthetic calibration</text><rect x="360" y="290" width="270" height="75" rx="8" fill="white" stroke="#26749b"/><text x="495.0" y="319" text-anchor="middle" font-size="17">Combiner + balanced detector</text><text x="495.0" y="344" text-anchor="middle" font-size="13">Desired return + LO + foreign light</text><rect x="810" y="290" width="230" height="75" rx="8" fill="white" stroke="#26749b"/><text x="925.0" y="319" text-anchor="middle" font-size="17">Foreign LiDAR B</text><text x="925.0" y="344" text-anchor="middle" font-